<!doctype html>
<html lang="en" class="font-body">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Better, Longer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { bg:'#14161a', surface:'#1c1f24', surface2:'#20242a', border:'#2a2e33', text:'#eef0ee', muted:'#9aa0a6', accent:'#c8ff5b' },
        fontFamily: { display: ['Archivo','sans-serif'], body: ['"Public Sans"','sans-serif'] }
      } }
    }
  </script>
  <style>
    body { background:#14161a; color:#eef0ee; } a { color: inherit; text-decoration: none; }
    .reveal { opacity: 0; transform: translateY(28px); transition: opacity 0.75s cubic-bezier(0.16,1,0.3,1), transform 0.75s cubic-bezier(0.16,1,0.3,1); }
    .reveal.is-visible { opacity: 1; transform: translateY(0); }
    @keyframes cascade-in { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: translateY(0); } }
    .cascade-line { opacity: 0; animation: cascade-in 0.8s cubic-bezier(0.16,1,0.3,1) forwards; }
    @keyframes badge-pop { 0% { opacity: 0; transform: scale(0.85); } 60% { opacity: 1; transform: scale(1.06); } 100% { opacity: 1; transform: scale(1); } }
    .badge-pop { opacity: 0; animation: badge-pop 0.65s cubic-bezier(0.16,1,0.3,1) forwards; }
    .hero-img-wrap { overflow: hidden; }
    .hero-img { transition: transform 1s cubic-bezier(0.16,1,0.3,1); will-change: transform; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="pages/home.js"></script>
</body>
</html>
